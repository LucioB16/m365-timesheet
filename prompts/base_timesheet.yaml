=====================================================================
METHOD
=====================================================================
1. Start from the CRM case list above as the primary baseline of case work for the
   range. Then search Microsoft 365 only within {{RANGE_START}}..{{RANGE_END}}, normalized to
   {{TIMEZONE}}. Out-of-range material may be used to interpret an in-range item, but
   never receives hours; note it as context only.
2. For each CRM case, recover matching M365 evidence (emails, Teams, meetings,
   artifacts) to describe the actual work and estimate hours for the correct day.
3. Run discovery for in-range meetings, chats, emails and artifacts that are not clearly
   tied to a CRM case; attribute them by known IDs, aliases, client/project names and
   artifact names. This is where internal and non-case work must be captured.
4. Explicitly sweep internal meetings in range: daily standups, weekly team call,
   AI/CX delivery calls, 1:1s, town halls, and optional office hours. Add one
   evidence item for each meeting you find; if a meeting type is not found, add a
   `verify` note instead of inventing it.
5. Attribute each piece of evidence to a client / project / ticket by matching against
   the known IDs, the alias mappings, client and project names, email subjects, meeting
   titles, filenames, attachments and artifact names.
6. Anything with no clear client, project or ticket association is Internal /
   Non-Billable. Anything that is work on our own CRM, portal, SLAs or internal
   tooling goes on its own "{{INTERNAL_SYSTEMS_CLIENT}}" line instead, never merged
   into the general Internal row.
7. Group the day's evidence into activities, then consolidate per client: each day has
   AT MOST ONE ROW PER CLIENT. Multiple tickets for the same client on the same day are
   merged into that single row.
8. For each client/day with several cases, provide concise per-case snippets that can
   be rendered later as `CAS-123: <desc>; CAS-456: <desc>` under the same 255-char
   maximum. Keep each case snippet short and specific.
9. Cross-check case descriptions against the local evidence block (git commit subjects
   and case artifacts). When available in evidence, use each case AGENTS/activity log
   notes to avoid contradicting local history.
10. Write the Description with action verbs and concrete artifacts, prefixing each
   ticket's summary with its ID, e.g.
   "CAS-12345: Triaged vendor email flow issue; reviewed run history; adjusted retry
   policy." and for several tickets
   "CAS-12345: Triaged vendor email flow, reviewed run history. CAS-12346: Adjusted
   retry policy for outbound connector."
   Say what was actually done (investigation, configuration, deployment, testing,
   coordination, resolution), which artifacts were touched (flow, plugin, table,
   environment, document, meeting) and the outcome or next step when known. Avoid vague
   verbs like "worked on", "reviewed" or "looked at" unless paired with a concrete
   object and result. Maximum information density, but each Description must be
   <= 255 characters as plain text including spaces, punctuation and ID prefixes.
11. Prioritize known meeting durations and documented work blocks; allocate the remaining
   time to adjacent evidenced work from the same day.
12. Every working day total must equal {{HOURS_PER_DAY}} exactly. If a day has too little
   evidence, put the remainder on Internal / Non-Billable and add
   "VERIFY - insufficient evidence for remaining time" to that row's comments.
13. Non-working days get no hours unless there is clear evidence of work; if there is,
   include the row and mark it "VERIFY - non-working day".
14. Hours rules: every value is a multiple of 0.25 and is written with exactly two
   decimals (0.25, 0.50, 0.75, 1.00, 2.50, 8.00). If a sourced duration is not a
   multiple of 0.25, round to the nearest 0.25 and add "VERIFY - rounded from X.XX". If
   you must balance a day, adjust adjacent evidenced tasks by +/-0.25 and add
   "VERIFY - balance adjustment".
15. If you find any ticket, bug, case, Jira, DevOps or ServiceNow ID that is NOT in the
    KNOWN WORK ITEMS list, do not bill it. Record it in discovered_ids in the JSON block
    and park its time on Internal / Non-Billable for that day with
    "VERIFY - pending discovered ID confirmation".
16. If a non-internal client activity has no confirmed case/ticket ID, do not invent one.
    Record it in `needs_case_confirmation` with date/client/evidence/context so the user
    can decide before final submission.

=====================================================================
SAFETY
=====================================================================
- Do not quote sensitive message content. Reference only safe identifiers: subject
