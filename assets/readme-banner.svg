  <rect x="1197" y="285" width="354" height="128" rx="27" fill="#0a3071"/>
  <rect x="1221" y="314" width="86" height="71" rx="7" fill="#fff"/>
  <path d="M1233 331H1296M1233 346H1296M1233 361H1286M1255 331V374" stroke="#0a3071" stroke-width="5"/>
  <circle cx="1303" cy="372" r="25" fill="#06b67d" stroke="#fff" stroke-width="5"/>
  <path d="M1291 372L1300 381L1317 362" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1347 315V386" stroke="#7893b7" stroke-width="2"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="750" fill="#fff">
    <text x="1372" y="340">Verified</text><text x="1372" y="377">Timesheet</text>
